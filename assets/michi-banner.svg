<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="160">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="796" height="156" rx="16" fill="url(#bgGlow)" stroke="#27272a" stroke-width="1.5"/>

  <!-- Live Status Badge -->
  <g transform="translate(680, 24)">
    <rect x="-10" y="-12" width="94" height="24" rx="12" fill="#14532d" fill-opacity="0.4" stroke="#22c55e" stroke-width="1"/>
    <circle cx="2" cy="0" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="4" fill="#4ade80" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" letter-spacing="1">EN VIVO</text>
  </g>

  <!-- Step 1: Sporting API -->
  <g transform="translate(70, 75)">
    <rect x="-45" y="-35" width="90" height="70" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1.2"/>
    <text x="0" y="-8" text-anchor="middle" font-size="20">🏪</text>
    <text x="0" y="12" text-anchor="middle" fill="#f43f5e" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="bold">Sporting</text>
    <text x="0" y="25" text-anchor="middle" fill="#71717a" font-size="9" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Catálogo VTEX</text>
  </g>

  <!-- Arrow 1 with pulse -->
  <path d="M 125 75 L 195 75" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="4,4">
    <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite"/>
  </path>
  <polygon points="198,75 190,71 190,79" fill="#818cf8"/>

  <!-- Step 2: Python Scraper -->
  <g transform="translate(250, 75)">
    <rect x="-50" y="-35" width="100" height="70" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1.2"/>
    <text x="0" y="-8" text-anchor="middle" font-size="20">⚡</text>
    <text x="0" y="12" text-anchor="middle" fill="#38bdf8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="bold">Python Bot</text>
    <text x="0" y="25" text-anchor="middle" fill="#71717a" font-size="9" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Scraper c/ 30 min</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 310 75 L 380 75" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="4,4">
    <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite"/>
  </path>
  <polygon points="383,75 375,71 375,79" fill="#a855f7"/>

  <!-- Step 3: Neon DB -->
  <g transform="translate(435, 75)">
    <rect x="-45" y="-35" width="90" height="70" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1.2"/>
    <text x="0" y="-8" text-anchor="middle" font-size="20">🐘</text>
    <text x="0" y="12" text-anchor="middle" fill="#c084fc" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="bold">Neon DB</text>
    <text x="0" y="25" text-anchor="middle" fill="#71717a" font-size="9" font-family="-apple-system, BlinkMacSystemFont, sans-serif">PostgreSQL</text>
  </g>

  <!-- Split arrows -->
  <path d="M 490 60 Q 530 45 560 45" fill="none" stroke="#229ED9" stroke-width="2" stroke-dasharray="4,4">
    <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite"/>
  </path>
  <polygon points="565,45 557,41 557,49" fill="#229ED9"/>

  <path d="M 490 90 Q 530 105 560 105" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,4">
    <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite"/>
  </path>
  <polygon points="565,105 557,101 557,109" fill="#22c55e"/>

  <!-- Step 4A: Telegram -->
  <g transform="translate(635, 45)">
    <rect x="-60" y="-22" width="120" height="44" rx="10" fill="#18181b" stroke="#229ED9" stroke-width="1.2"/>
    <text x="-40" y="5" font-size="16">📲</text>
    <text x="-16" y="-2" fill="#38bdf8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="bold">Telegram</text>
    <text x="-16" y="12" fill="#71717a" font-size="9" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Alertas de oferta</text>
  </g>

  <!-- Step 4B: Web Next.js -->
  <g transform="translate(635, 105)">
    <rect x="-60" y="-22" width="120" height="44" rx="10" fill="#18181b" stroke="#22c55e" stroke-width="1.2"/>
    <text x="-40" y="5" font-size="16">🌐</text>
    <text x="-16" y="-2" fill="#4ade80" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="bold">Web Vercel</text>
    <text x="-16" y="12" fill="#71717a" font-size="9" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Catálogo online</text>
  </g>

  <!-- Little bouncing sneaker on top left -->
  <g transform="translate(35, 24)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="2s" repeatCount="indefinite"/>
      <text font-size="20">👟</text>
    </g>
  </g>
</svg>
